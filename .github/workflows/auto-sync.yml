name: Auto Sync Upstream & Release Addons

on:
  schedule:
    # 每天 00:00 和 12:00 UTC (北京时间 08:00 和 20:00) 自动检查上游
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 缓存未打补丁的原始上游插件包，供 scripts/fetch-addons.js 在上游下载失败时回退（不会回退到已打补丁产物）
      - name: Restore Raw Upstream Addon Cache
        uses: actions/cache@v4
        with:
          path: .cache/upstream-addons
          key: upstream-addons-${{ github.run_id }}
          restore-keys: |
            upstream-addons-

      - name: Fetch Latest Upstream Addons & Apply Localizations
        run: node scripts/fetch-addons.js
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create or Update Auto-Sync PR if Updated
        env:
          GH_TOKEN: ${{ secrets.AUTO_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Check if scripts/locales or the bundled version manifest has changes
          # (upstream releases update src/generated/addon-versions.json, which triggers a redeploy)
          git add scripts/locales src/generated/addon-versions.json
          if git diff --staged --quiet; then
            echo "No upstream addon updates detected."
          else
            echo "Updates detected! Pushing to chore/auto-sync-addons..."
            SYNC_BRANCH="chore/auto-sync-addons"
            git commit -m "chore(auto-sync): update addons from upstream with zhCN patches"
            git push --force origin "HEAD:${SYNC_BRANCH}"

            EXISTING_PR=$(gh pr list --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number // empty')
            if [ -n "${EXISTING_PR}" ]; then
              echo "Updated existing auto-sync PR #${EXISTING_PR}."
            else
              ISSUE_URL=$(gh issue create \
                --title "chore(auto-sync): 上游插件自动同步更新" \
                --body "由 \`auto-sync.yml\` 定时任务检测到上游插件更新并自动创建，用于关联自动同步 PR。")
              ISSUE_NUM="${ISSUE_URL##*/}"
              PR_URL=$(gh pr create \
                --head "${SYNC_BRANCH}" \
                --base main \
                --title "chore(auto-sync): update addons from upstream with zhCN patches" \
                --body "$(printf 'Fixes #%s\n\n由 `auto-sync.yml` 自动拉取上游最新插件并同步本地化补丁与版本清单。' "${ISSUE_NUM}")")
              echo "Created auto-sync PR: ${PR_URL}"
            fi
          fi
