name: PR Quality Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read
  issues: read
  contents: read

jobs:
  check-linked-issue:
    name: 检查是否关联 Issue
    runs-on: ubuntu-latest
    steps:
      - name: 验证关联的 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            // 1. 查询 GitHub GraphQL 获取原生通过 Development 面板或描述关键字关联的 Issue
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 5) {
                      totalCount
                      nodes {
                        number
                        title
                      }
                    }
                  }
                }
              }
            `;

            let linkedCount = 0;
            try {
              const res = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: pr.number
              });
              linkedCount = res?.repository?.pullRequest?.closingIssuesReferences?.totalCount || 0;
              if (linkedCount > 0) {
                const issues = res.repository.pullRequest.closingIssuesReferences.nodes
                  .map(n => `#${n.number} ("${n.title}")`)
                  .join(', ');
                console.log(`✅ 校验通过：已检测到原生关联的 Issue：${issues}`);
                return;
              }
            } catch (err) {
              console.log('ℹ️ GraphQL 查询 closingIssuesReferences 提示：', err.message);
            }

            // 2. 正则检查 PR 描述（Description）中是否包含关闭或关联关键字
            // 注意：GitHub 仅识别 PR 描述或 Development 面板关联，标题中的关键字不会自动关联/关闭 Issue
            let targetOwner = context.repo.owner;
            let targetRepo = context.repo.repo;
            let matchedIssue = null;

            // 优先检查是否提供了完整的 GitHub Issue URL
            const urlMatch = body.match(/https:\/\/github\.com\/([^/]+)\/([^/]+)\/issues\/(\d+)/i);
            if (urlMatch) {
              targetOwner = urlMatch[1];
              targetRepo = urlMatch[2];
              matchedIssue = parseInt(urlMatch[3], 10);
            } else {
              // 匹配 Fixes #123, Closes #123, 或独立 #123
              const patterns = [
                /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved|refs?|issue)\s*[:#]?\s*#?(\d+)/i,
                /(?:^|\s)#(\d+)(?:\s|$|[.,!?])/m
              ];

              for (const pattern of patterns) {
                const match = body.match(pattern);
                if (match) {
                  matchedIssue = parseInt(match[1], 10);
                  break;
                }
              }
            }

            if (!matchedIssue) {
              core.setFailed(
                '❌ PR 未在描述中关联任何 Issue！\n\n' +
                '【规则说明】：合并到 main 分支的所有 PR 必须关联对应的 Issue。\n' +
                '【如何修复】：\n' +
                '  1. 编辑当前 PR 描述（Description），添加：Fixes #<Issue编号> 或 Closes #<Issue编号>\n' +
                '     （注意：写在 PR 标题中无效，必须写在 PR 描述中）\n' +
                '  2. 或者在 PR 页面右侧栏的 "Development" 部分手动点击并链接对应的 Issue。\n'
              );
              return;
            }

            // 3. 校验匹配到的目标是否真实存在，且必须是 Issue（而非 Pull Request）
            try {
              const issueRes = await github.rest.issues.get({
                owner: targetOwner,
                repo: targetRepo,
                issue_number: matchedIssue
              });

              // GitHub Issues API 在查询 Pull Request 时也会返回数据，通过 pull_request 属性进行区分
              if (issueRes.data.pull_request) {
                core.setFailed(
                  `❌ 关联目标 ${targetOwner}/${targetRepo}#${matchedIssue} 是 Pull Request 而非 Issue！\n` +
                  '【规则说明】：PR 必须关联对应的 Issue，不能关联另一个 PR。'
                );
                return;
              }

              console.log(`✅ 校验通过：在 PR 描述中检测到并验证了真实存在的 Issue ${targetOwner}/${targetRepo}#${matchedIssue} ("${issueRes.data.title}")`);
            } catch (err) {
              core.setFailed(`❌ PR 描述中引用的 Issue ${targetOwner}/${targetRepo}#${matchedIssue} 不存在或无权访问，请检查 Issue 编号是否正确！`);
            }
