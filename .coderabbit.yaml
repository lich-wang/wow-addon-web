# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI 配置文件
language: "zh-CN"
tone_instructions: "使用专业、清晰、友好的中文进行代码评审"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true # 开启 commit status check，方便在 GitHub 分支保护中设置为必需项
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

chat:
  auto_reply: true
