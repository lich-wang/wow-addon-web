name: Auto Sync Upstream & Release Addons

on:
  schedule:
    # 每天 00:00 和 12:00 UTC (北京时间 08:00 和 20:00) 自动检查上游
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 缓存未打补丁的原始上游插件包，供 scripts/fetch-addons.js 在上游下载失败时回退（不会回退到已打补丁产物）
      - name: Restore Raw Upstream Addon Cache
        uses: actions/cache@v4
        with:
          path: .cache/upstream-addons
          key: upstream-addons-${{ github.run_id }}
          restore-keys: |
            upstream-addons-

      - name: Fetch Latest Upstream Addons & Apply Localizations
        run: node scripts/fetch-addons.js
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit and Push if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if scripts/locales or the bundled version manifest has changes
          # (upstream releases update src/generated/addon-versions.json, which triggers a redeploy)
          git add scripts/locales src/generated/addon-versions.json
          if git diff --staged --quiet; then
            echo "No upstream addon updates detected."
          else
            echo "Updates detected! Committing and pushing..."
            git commit -m "chore(auto-sync): update addons from upstream with zhCN patches"
            git push origin main
          fi
