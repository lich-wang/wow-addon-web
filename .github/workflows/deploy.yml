name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_run:
    workflows: ["Release Tauri Desktop App"]
    types: [completed]

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 缓存未打补丁的原始上游插件包，供 scripts/fetch-addons.js 在上游下载失败时回退（不会回退到已打补丁产物）
      - name: Restore Raw Upstream Addon Cache
        uses: actions/cache@v4
        with:
          path: .cache/upstream-addons
          key: upstream-addons-${{ github.run_id }}
          restore-keys: |
            upstream-addons-

      - name: Fetch and Bundle Addons from GitHub to public/addons
        run: node scripts/fetch-addons.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Latest Desktop Client Release to public/downloads
        run: node scripts/fetch-client.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web Frontend
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name wow-addon-web --branch main --commit-dirty=true
