[package]
name = "wow-agent"
version = "1.0.0"
edition = "2021"
description = "High-performance native bridge agent for WoW Web Addon Manager"
authors = ["lich-wang"]

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
open = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
regex = "1.10"
sysinfo = "0.30"
