name: Release Tauri Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.2)'
        required: false
        default: ''

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            build-cmd: 'npm run tauri build'
            artifact-name: 'windows-assets'
          - platform: 'macos-latest'
            build-cmd: 'npm run tauri build -- --target universal-apple-darwin'
            artifact-name: 'macos-assets'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Desktop Package
        run: ${{ matrix.build-cmd }}

      - name: Gather Windows bundles
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist-bundles
          # Copy standalone executable directly (单文件绿色免安装版，双击直接运行)
          find src-tauri/target/release -maxdepth 1 -type f -name "*.exe" -exec cp {} dist-bundles/WoW-Addon-Manager.exe \;
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp dist-bundles/WoW-Addon-Manager.exe dist-bundles/WoW-Addon-Manager-v${VERSION}.exe
          # Also package into zip for users who prefer zip download
          powershell -Command "Compress-Archive -Path dist-bundles/WoW-Addon-Manager.exe -DestinationPath dist-bundles/WoW-Addon-Manager-windows-x64.zip"
          ls -la dist-bundles/

      - name: Gather macOS bundles
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir -p dist-bundles
          find src-tauri/target/universal-apple-darwin/release/bundle -type f -name "*.dmg" -exec cp {} dist-bundles/ \;
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DMG_FILE=$(find dist-bundles -maxdepth 1 -name "*.dmg" | head -n 1)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" dist-bundles/WoW-Addon-Manager-v${VERSION}.dmg
            cp "$DMG_FILE" dist-bundles/WoW-Addon-Manager.dmg
          fi
          if [ -d "src-tauri/target/universal-apple-darwin/release/bundle/macos/WoW-Addon-Manager.app" ]; then
            tar -czf dist-bundles/WoW-Addon-Manager_universal.app.tar.gz -C src-tauri/target/universal-apple-darwin/release/bundle/macos WoW-Addon-Manager.app
          fi
          ls -la dist-bundles/

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist-bundles/*
          if-no-files-found: error

  publish-release:
    needs: build-tauri
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Tag
        id: get_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List all downloaded release files
        run: |
          ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: '魔兽世界插件管理器桌面版 ${{ steps.get_tag.outputs.tag }}'
          body: |
            魔兽世界网页插件管理器 - 官方原生桌面客户端 (基于 Tauri 2.0)。

            ### ✨ 核心特性
            - 🚀 **彻底解除系统盘权限限制**：原生直通读写 `C:\Program Files (x86)\World of Warcraft`，无需每次浏览器弹窗授权。
            - 🔄 **随 Web 服务器自动同步更新**：自动加载云端（https://wow.lich.tech），界面与插件源随时最新，无需频繁重装。
            - ⚡ **无限服 (WoW Forever) 优先适配**：优先展示与识别无限服目录及专属插件。
            - 🟢 **游戏运行状态实时感知**：智能感知正在运行的魔兽版本，无缝切换。

            ### 📦 下载运行
            - **Windows**: 下载 `WoW-Addon-Manager.exe`（单文件绿色免安装版，直接双击运行，无须安装器）
            - **macOS**: 下载 `.dmg`（通用版，原生支持 M1/M2/M3/M4 及 Intel Mac）
          files: release-assets/*
          draft: false
          prerelease: false
