# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI 配置文件
language: "zh-CN"
tone_instructions: "使用专业、清晰、友好的中文进行代码评审"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: true
  # 生成的数据快照（由 scripts/generate-reputation-data.mjs 产出）不参与代码评审
  path_filters:
    - "!scripts/locales/wowf-reputation-data.json"
  high_level_summary: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

chat:
  auto_reply: true
